<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>WSDOM Demo</title>
	<script type="module">
		import { WSDOMTransport } from "/transport.js";

		function setConnectingLabel(text) {
			const conLabelUi = document.getElementById("connecting-label");
			if (conLabelUi) conLabelUi.innerText = text;
		}
		class WSDOM {
			constructor(sendMessage) {
				this.internal = new WSDOMInternal(sendMessage);
			}
			handleIncomingMessage(msg) {
				const fn = new Function('_w', msg);
				fn(this.internal);
			}
		}
		class WSDOMInternal {
			constructor(sender) {
				this.g = (id) => {
					return this.values.get(id);
				};
				this.s = (id, value) => {
					this.values.set(id, value);
				};
				this.d = (id) => {
					this.values.delete(id);
				};
				this.r = (id, val) => {
					const valJson = JSON.stringify(val);
					(this.sender)(`${id}:${valJson}`);
				};
				this.sender = sender;
				this.values = new Map();
			}
		}
		const transport = new WSDOMTransport(WSDOM, [], {
			transport: { kind: "websocket", url: window.location.href.replace('http://', 'ws://') + '/ws' },
			onStatusChange: (status) => {
				if (status === "open") setConnectingLabel("Connected to WSDOM server.");
				if (status === "reconnecting") setConnectingLabel("Disconnected from WSDOM server. Retrying…");
			},
			onError: () => setConnectingLabel("WebSocket error. Retrying…"),
		});
		void transport.start();
	</script>
	<style>
		#connecting-label {
			position: fixed;
			bottom: 0;
			right: 0;
		}
	</style>
</head>

<body>
	<span id="connecting-label">Connecting...</span>
</body>

</html>
