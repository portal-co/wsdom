<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<script type="module">
		import { WSDOMTransport } from "/transport.js";
		class WSDOM {
			constructor(sendMessage) {
				this.internal = new WSDOMInternal(sendMessage);
			}
			handleIncomingMessage(msg) {
				const fn = new Function('_w', msg);
				fn(this.internal);
			}
		}
		class WSDOMInternal {
			constructor(sender) {
				this.g = (id) => {
					return this.values.get(id);
				};
				this.s = (id, value) => {
					this.values.set(id, value);
				};
				this.d = (id) => {
					this.values.delete(id);
				};
				this.r = (id, val) => {
					const valJson = JSON.stringify(val);
					(this.sender)(`${id}:${valJson}`);
				};
				this.sender = sender;
				this.values = new Map();
			}
		}
		const transport = new WSDOMTransport(WSDOM, [], {
			transport: { kind: "websocket", url: "ws://localhost:4000/ws" },
		});
		void transport.start();
	</script>
</head>

<body>

</body>

</html>
